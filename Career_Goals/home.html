<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    const form = document.querySelector('[name="student_entry_training"]');
    const inputs = form.querySelectorAll('#inputs input')
    const labels = form.querySelectorAll('#inputs label')
    let studentText = "";
    let filledLabel = "";
    let studentInput = "";

    function Display() {
        labels.forEach(function (label, index) {
            filledLabel = label.innerHTML;
            studentInput = inputs[index].value;
            studentText += filledLabel + "<br><span style='color: rgb(0, 0, 0) !important;'>" + studentInput + "</span><br><br>";
            console.log(studentText)
        });
        form.remove();
        document.getElementById("displaytraininggoals").innerHTML = studentText;
    }

    const studentImageUpload = document.querySelector("#inputGroupFile02");
    let uploadedImage = "";

    studentImageUpload.addEventListener("change", function () {
        const reader = new FileReader();
        reader.addEventListener("load", () => {
            uploadedImage = reader.result;
            document.querySelector("#student-pic").style.backgroundImage = `url(${uploadedImage})`
        })
        reader.readAsDataURL(this.files[0]);
        studentImageUpload.remove();
    });

    function videoDrop() {
        const videodropinput = document.getElementById("student-vid-drop").value;
        const str = "watch?v=";
        var newUploadVideo = "";
        console.log(videodropinput)

        //check if url is valid youtube url
        if (!isValidYouTubeUrl(videodropinput)) {
            alert("Please enter a valid YouTube video URL.");
            return;
        }

        const videoID = getYoutubeVideoId(videodropinput);

        var makeMatch = videodropinput.includes(str)
        if (makeMatch) {
            newUploadinput = videodropinput.replace(str, "embed/");
            console.log(newUploadinput)
        }
        document.querySelector("iframe").setAttribute("src", newUploadinput)
        console.log(document.querySelector("iframe").src)

    }

    function isValidYouTubeUrl(url) {
        //regex to check YouTube URL format using regex test method
        const youtubeRegex = /^(https?:\/\/)?(www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})$/;
        return youtubeRegex.test(url);
    }

    function getYoutubeVideoId(url) {
        //extract video ID from URL
        const urlParams = new URLSearchParams(new URL(url).search);
        console.log(urlParams, URLSearchParams )
        return urlParams.get("v");
    }

   
    var careerInput;
    function myCareer() {
        careerInput = document.getElementById('future-career-input').value
        document.getElementById('future-career-input').remove()
        
        document.getElementById('my-career-input').innerHTML = careerInput;
        document.getElementById('future-career-input-btn').remove()
    };

</script>
